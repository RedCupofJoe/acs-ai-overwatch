# Name matches Helm (values.rhoai.certManager.operatorGroup.name).
# OwnNamespace only. An empty spec is a second, AllNamespaces group and OLM
# fails the CSV with TooManyOperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator-og
  namespace: cert-manager-operator
spec:
  targetNamespaces:
    - cert-manager-operator
  upgradeStrategy: Default
