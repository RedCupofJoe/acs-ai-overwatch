apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml
  - namespace.yaml
  - rbac.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: job-aws-gpu-machineset
    namespace: nvidia-gpu-operator
    files:
      - job.sh
      - machineset-patch.yaml
