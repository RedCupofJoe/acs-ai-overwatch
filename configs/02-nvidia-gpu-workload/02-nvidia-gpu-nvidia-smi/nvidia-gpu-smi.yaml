apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi
  labels:
    app: nvidia-smi
spec:
  restartPolicy: OnFailure
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: cuda-vectoradd
    image: "nvidia/samples:vectoradd-cuda11.2.1"
    command: ["/bin/sh", "-c", "nvidia-smi && sleep 300"]
    resources:
      limits:
        nvidia.com/gpu: 1
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
