apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
  labels:
    app: rhods-dashboard
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: 'true'
    platform.opendatahub.io/part-of: dashboard
spec:
  dashboardConfig:
    disableKueue: false  # Enables kueue workload management in the dashboard
    disableTracking: false
    observabilityDashboard: true  # Enable observability dashboard TP feature
    genAiStudio: true  # Enable genAI studio TP feature
    externalModels: true # Enable external models
  hardwareProfileOrder: []
  notebookController:
    enabled: true
    notebookNamespace: rhods-notebooks
    pvcSize: 20Gi
  templateDisablement:  # Disable templates that are not needed
    - vllm-spyre-ppc64le-runtime
    - vllm-gaudi-runtime
    - vllm-spyre-x86-runtime
    - vllm-rocm-runtime
    - vllm-cpu-runtime
    - vllm-spyre-s390x-runtime
  templateOrder: []
