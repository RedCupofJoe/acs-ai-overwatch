# Apply the Tekton Tasks/Pipelines into acs-agent-builder (OpenShift Pipelines operator required).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: agents-build-
  namespace: acs-agent-builder
  labels:
    app.kubernetes.io/part-of: acs-ai-overwatch
spec:
  pipelineRef:
    name: build-demo-agents
  params:
    - name: git-url
      value: https://github.com/RedCupofJoe/acs-ai-overwatch.git
    - name: git-revision
      value: main
    - name: image-registry
      value: quay-quay-app.quay.svc.cluster.local:80
    - name: image-org
      value: acs-agents
    - name: image-tag
      value: latest
    - name: push-tls-verify
      value: "false"
  workspaces:
    - name: shared-source
      volumeClaimTemplate:
        metadata:
          labels:
            app.kubernetes.io/part-of: acs-ai-overwatch
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: gp3-csi
          resources:
            requests:
              storage: 20Gi
    - name: registry-credentials
      secret:
        secretName: quay-build-robot
