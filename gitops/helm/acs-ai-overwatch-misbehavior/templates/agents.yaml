apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.agentsRoseyRegrets.pvc.name }}
  {{- include "misbehavior.wave" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "misbehavior.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.defaultStorageClass }}
  resources:
    requests:
      storage: {{ .Values.agentsRoseyRegrets.pvc.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpful-hank
  {{- include "misbehavior.wave" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "misbehavior.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: helpful-hank
    {{ .Values.acs.telemetryLabel.key }}: {{ .Values.acs.telemetryLabel.value | quote }}
spec:
  replicas: {{ if eq .Values.enforcement.mode "enforce" }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: helpful-hank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpful-hank
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: acs-ai-overwatch
        {{ .Values.acs.telemetryLabel.key }}: {{ .Values.acs.telemetryLabel.value | quote }}
    spec:
      serviceAccountName: {{ .Values.agents.serviceAccountName }}
      {{- include "misbehavior.gpuTolerations" . | nindent 6 }}
      initContainers:
        {{- include "misbehavior.ggufInit" (dict "root" . "image" (include "misbehavior.image" (dict "root" . "stream" "helpful-hank"))) | nindent 8 }}
      containers:
        {{- include "misbehavior.llama" (dict "root" .) | nindent 8 }}
        - name: helpful-hank
          image: {{ include "misbehavior.image" (dict "root" . "stream" "helpful-hank") }}
          imagePullPolicy: Always
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.agents.agentServicePort | quote }}
            - name: AGENT_SYSTEM_PROMPT_FILE
              value: /etc/acs-agent/system_prompt.txt
            - name: AGENT_ROLE
              value: helpful-hank
            {{- include "misbehavior.localLlamaEnv" . | nindent 12 }}
            {{- include "misbehavior.otelEnv" (dict "Values" .Values "serviceName" "helpful-hank") | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.agents.agentServicePort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: helpful-hank
  {{- include "misbehavior.wave" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "misbehavior.labels" . | nindent 4 }}
    app.kubernetes.io/name: helpful-hank
spec:
  selector:
    app.kubernetes.io/name: helpful-hank
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.agents.agentServicePort }}
---
{{ include "misbehavior.route" (dict "root" . "name" "helpful-hank") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosey-regrets
  {{- include "misbehavior.wave" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "misbehavior.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: rosey-regrets
    acs-ai-overwatch.io/recon: "true"
    {{ .Values.acs.telemetryLabel.key }}: {{ .Values.acs.telemetryLabel.value | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rosey-regrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rosey-regrets
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: acs-ai-overwatch
        acs-ai-overwatch.io/recon: "true"
        {{ .Values.acs.telemetryLabel.key }}: {{ .Values.acs.telemetryLabel.value | quote }}
    spec:
      serviceAccountName: {{ .Values.agents.roseyServiceAccountName }}
      {{- include "misbehavior.gpuTolerations" . | nindent 6 }}
      initContainers:
        {{- include "misbehavior.ggufInit" (dict "root" . "image" (include "misbehavior.image" (dict "root" . "stream" "rosey-regrets"))) | nindent 8 }}
      containers:
        {{- include "misbehavior.llama" (dict "root" .) | nindent 8 }}
        - name: rosey-regrets
          image: {{ include "misbehavior.image" (dict "root" . "stream" "rosey-regrets") }}
          imagePullPolicy: Always
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.agents.agentServicePort | quote }}
            - name: AGENT_SYSTEM_PROMPT_FILE
              value: /etc/acs-agent/system_prompt.txt
            - name: AGENT_ROLE
              value: rosey-regrets
            - name: AGENT_ENABLE_NETWORK_AUDIT
              value: "true"
            - name: AGENT_AUTO_NETWORK_AUDIT
              value: {{ .Values.agents.rosey.autoNetworkAudit | quote }}
            - name: AGENT_LLM_DRIVEN_NETWORK_AUDIT
              value: {{ .Values.agents.rosey.llmDrivenNetworkAudit | quote }}
            - name: AGENT_OUTPUT_DIR
              value: {{ .Values.agents.rosey.outputMountPath | quote }}
            - name: NETWORK_AUDIT_COMMAND
              value: {{ .Values.agents.rosey.networkAuditCommand | quote }}
            - name: NETWORK_AUDIT_CIDR
              value: {{ .Values.agents.rosey.networkAuditCidr | quote }}
            - name: NETWORK_AUDIT_TIMEOUT_SEC
              value: {{ .Values.agents.rosey.networkAuditTimeoutSec | quote }}
            {{- include "misbehavior.localLlamaEnv" . | nindent 12 }}
            {{- include "misbehavior.otelEnv" (dict "Values" .Values "serviceName" "rosey-regrets") | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.agents.agentServicePort }}
          volumeMounts:
            - name: agent-output
              mountPath: {{ .Values.agents.rosey.outputMountPath | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 8Gi
        - name: agent-output
          persistentVolumeClaim:
            claimName: {{ .Values.agentsRoseyRegrets.pvc.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: rosey-regrets
  {{- include "misbehavior.wave" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "misbehavior.labels" . | nindent 4 }}
    app.kubernetes.io/name: rosey-regrets
spec:
  selector:
    app.kubernetes.io/name: rosey-regrets
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.agents.agentServicePort }}
---
{{ include "misbehavior.route" (dict "root" . "name" "rosey-regrets") }}
