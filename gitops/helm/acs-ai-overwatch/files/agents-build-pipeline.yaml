# OpenShift Pipelines (Tekton): clone this repo, build agent images with Buildah, push to Quay.
# GitOps applies this file via the umbrella chart when components.pipelines.enabled is true.
# Manual: oc apply -n acs-agent-builder -f pipelines/tekton/agents-build-pipeline.yaml
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: agents-git-clone
  namespace: acs-agent-builder
  labels:
    app.kubernetes.io/part-of: acs-ai-overwatch
spec:
  description: Shallow clone of a Git repository into the output workspace.
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: docker.io/alpine/git:latest
      script: |
        set -euo pipefail
        dest="$(workspaces.output.path)"
        cd "${dest}"
        find "${dest}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        git clone --depth 1 -b "$(params.revision)" "$(params.url)" .
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: agents-buildah-image
  namespace: acs-agent-builder
  labels:
    app.kubernetes.io/part-of: acs-ai-overwatch
spec:
  description: Build a Dockerfile from the source workspace and push with buildah (privileged; vfs storage driver).
  params:
    - name: image
      type: string
      description: Full destination image reference (registry/org/repo:tag)
    - name: dockerfile
      type: string
      description: Path to Dockerfile relative to repository root
    - name: tls-verify
      type: string
      description: Whether to verify TLS when pushing (often false for internal Quay)
      default: "false"
  workspaces:
    - name: source
    - name: registry-secret
      optional: true
  steps:
    - name: build-and-push
      image: registry.redhat.io/rhel9/buildah:latest
      securityContext:
        privileged: true
      script: |
        set -euo pipefail
        mkdir -p "${HOME}/.docker"
        if [ -d "$(workspaces.registry-secret.path)" ] && [ -f "$(workspaces.registry-secret.path)/.dockerconfigjson" ]; then
          cp "$(workspaces.registry-secret.path)/.dockerconfigjson" "${HOME}/.docker/config.json"
        fi
        cd "$(workspaces.source.path)"
        buildah bud --layers --storage-driver=vfs -f "$(params.dockerfile)" -t "$(params.image)" .
        buildah push --storage-driver=vfs --tls-verify="$(params.tls-verify)" "$(params.image)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-demo-agents
  namespace: acs-agent-builder
  labels:
    app.kubernetes.io/part-of: acs-ai-overwatch
spec:
  description: >-
    Builds Helpful Hank, Rosey Regrets, Sneaky Sam, investigator, and builder images
    (UBI open harness) and pushes them to on-cluster Quay.
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: image-registry
      type: string
      default: quay-quay-app.quay.svc.cluster.local:80
    - name: image-org
      type: string
      default: acs-agents
    - name: image-tag
      type: string
      default: latest
    - name: push-tls-verify
      type: string
      default: "false"
  workspaces:
    - name: shared-source
    - name: registry-credentials
      optional: true
  tasks:
    - name: fetch-repository
      taskRef:
        name: agents-git-clone
      workspaces:
        - name: output
          workspace: shared-source
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
    - name: build-helpful-hank
      runAfter: [fetch-repository]
      taskRef:
        name: agents-buildah-image
      workspaces:
        - name: source
          workspace: shared-source
        - name: registry-secret
          workspace: registry-credentials
      params:
        - name: dockerfile
          value: agents/helpful-hank/Dockerfile
        - name: image
          value: $(params.image-registry)/$(params.image-org)/helpful-hank:$(params.image-tag)
        - name: tls-verify
          value: $(params.push-tls-verify)
    - name: build-rosey-regrets
      runAfter: [build-helpful-hank]
      taskRef:
        name: agents-buildah-image
      workspaces:
        - name: source
          workspace: shared-source
        - name: registry-secret
          workspace: registry-credentials
      params:
        - name: dockerfile
          value: agents/rosey-regrets/Dockerfile
        - name: image
          value: $(params.image-registry)/$(params.image-org)/rosey-regrets:$(params.image-tag)
        - name: tls-verify
          value: $(params.push-tls-verify)
    - name: build-sneaky-sam
      runAfter: [fetch-repository]
      taskRef:
        name: agents-buildah-image
      workspaces:
        - name: source
          workspace: shared-source
        - name: registry-secret
          workspace: registry-credentials
      params:
        - name: dockerfile
          value: agents/sneaky-sam/Dockerfile
        - name: image
          value: $(params.image-registry)/$(params.image-org)/sneaky-sam:$(params.image-tag)
        - name: tls-verify
          value: $(params.push-tls-verify)
    - name: build-investigator
      runAfter: [fetch-repository]
      taskRef:
        name: agents-buildah-image
      workspaces:
        - name: source
          workspace: shared-source
        - name: registry-secret
          workspace: registry-credentials
      params:
        - name: dockerfile
          value: agents/investigator/Dockerfile
        - name: image
          value: $(params.image-registry)/$(params.image-org)/acs-investigator:$(params.image-tag)
        - name: tls-verify
          value: $(params.push-tls-verify)
    - name: build-builder
      runAfter: [fetch-repository]
      taskRef:
        name: agents-buildah-image
      workspaces:
        - name: source
          workspace: shared-source
        - name: registry-secret
          workspace: registry-credentials
      params:
        - name: dockerfile
          value: agents/builder/Dockerfile
        - name: image
          value: $(params.image-registry)/$(params.image-org)/acs-agent-builder:$(params.image-tag)
        - name: tls-verify
          value: $(params.push-tls-verify)
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-remediated-agents
  namespace: acs-agent-builder
  labels:
    app.kubernetes.io/part-of: acs-ai-overwatch
spec:
  description: Agentic rebuild path — Remediated Rosey and Remediated Sam (MaaS, no scanners).
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: dockerfile
      type: string
    - name: image
      type: string
    - name: push-tls-verify
      type: string
      default: "false"
  workspaces:
    - name: shared-source
    - name: registry-credentials
      optional: true
  tasks:
    - name: fetch-repository
      taskRef:
        name: agents-git-clone
      workspaces:
        - name: output
          workspace: shared-source
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
    - name: build-image
      runAfter: [fetch-repository]
      taskRef:
        name: agents-buildah-image
      workspaces:
        - name: source
          workspace: shared-source
        - name: registry-secret
          workspace: registry-credentials
      params:
        - name: dockerfile
          value: $(params.dockerfile)
        - name: image
          value: $(params.image)
        - name: tls-verify
          value: $(params.push-tls-verify)
