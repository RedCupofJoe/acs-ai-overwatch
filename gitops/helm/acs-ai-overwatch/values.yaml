# Cluster-specific configuration — override via Argo CD, CI, or:
#   helm upgrade -i acs-ai-overwatch . -f values-poc.yaml -n openshift-gitops
#
# Storage: all PVCs (including Quay) use gp3-csi (EBS) by default.
# Override storage.defaultStorageClass when your cluster differs (oc get sc).
# Discovery (discover-cluster-values.sh / cluster-discovery Job) writes defaultStorageClass
# and OLM operator channels to acs-ai-overwatch-cluster-config; Helm prefers those at render time.
# Alternative: external registry — set quayStorage.enabled false and point agent images elsewhere.

global:
  partOf: acs-ai-overwatch

# GitOps layout: bootstrap Application owns Namespace objects (managed-by label).
gitops:
  bootstrapNamespaces: true

# Skip rendering operator CRs until CRDs exist (Helm lookup). Stops Argo apply errors on first sync.
# Set waitForCrds: false only if lookup is unavailable on the repo-server and CRDs are already installed.
platformResources:
  waitForCrds: true
  crds:
    dataScienceCluster: datascienceclusters.datasciencecluster.opendatahub.io
    notebook: notebooks.kubeflow.org
    hardwareProfile: hardwareprofiles.infrastructure.opendatahub.io
    clusterPolicy: clusterpolicies.nvidia.com
    quayRegistry: quayregistries.quay.redhat.com
    central: centrals.platform.stackrox.io
    securedCluster: securedclusters.platform.stackrox.io
    securityPolicy: securitypolicies.config.stackrox.io
    llmInferenceService: llminferenceservices.serving.kserve.io
    ogxServer: ogxservers.ogx.io
    tektonPipeline: pipelines.tekton.dev

# Argo CD sync waves (lower number syncs first). See README "Argo CD Sync Waves".
argocd:
  syncWaves:
    enabled: true
    namespace: "0"
    operators: "10"
    storage: "20"
    platformCRs: "30"
    secrets: "40"
    pvcs: "45"
    configMaps: "50"
    security: "55"
    workloads: "60"
    bootstrap: "70"
    agents: "80"
    # Mattermost last — capstone before PoC execution (after platform, ACS, agents).
    mattermostPrep: "85"
    mattermostWorkloads: "90"
    mattermostBootstrap: "95"
    # ACS bootstrap upserts Mattermost Notifier from mattermost-acs-integration ConfigMap (wave 95).
    acsBootstrap: "96"
    # SecurityPolicy CRs reference Mattermost Notifier; apply after notifier exists in Central.
    acsPolicies: "97"

# In-cluster discovery Job writes acs-ai-overwatch-cluster-config (see helm/acs-ai-overwatch-cluster-discovery).
clusterDiscovery:
  enabled: true
  namespace: acs-ai-overwatch-system
  configMapName: acs-ai-overwatch-cluster-config
  discoveryApplicationName: acs-ai-overwatch-cluster-discovery

cluster:
  # Optional override. When empty, read from ConfigMap written by cluster-discovery Application.
  name: acs-ai-overwatch
  appsDomain: ""
  # Describe layout (e.g. 3×3 failure domains / nodes); used for documentation ConfigMap only.
  topology: "3x3"
  gpu:
    # One AWS g6.12xlarge = 4× L4. Do not use 3× g6.4xlarge (1× L4 each): time-slicing
    # devices ["0"] would share every node GPU and leave no dedicated nvidia.com/gpu.
    count: 4
    nodes: 1
    instanceType: g6.12xlarge
    model: L4
    vendor: nvidia
    # GPU 0 is time-sliced as nvidia.com/gpu.shared (Hank, Rosey, Sam, builder).
    # GPU 1 and GPU 2 stay dedicated nvidia.com/gpu (investigator Gemma, MaaS Granite).
    # GPU 3 is spare dedicated nvidia.com/gpu.
    sharedIndex: "0"
    sharedReplicas: 4

# Optional ConfigMap with cluster facts (for operators / workbenches that read it).
clusterMetadata:
  enabled: true
  namespace: acs-ai-overwatch-system

# Default StorageClass for all PVCs (Mattermost, Quay, RHACS, Rosey, Tekton, Tempo).
storage:
  defaultStorageClass: gp3-csi

mattermost:
  enabled: true
  namespace: monitoring
  # Init container image to chown PVC data dir for UID 2000 (gp3-csi mounts root-owned).
  initImage: docker.io/library/busybox:1.36
  image:
    repository: mattermost/mattermost-team-edition
    tag: "10.11.15"
  pvc:
    storageClassName: gp3-csi
    size: 10Gi
  # External browser URL and Route host are discovered at runtime into ConfigMap
  # acs-ai-overwatch-cluster-config (mattermostSiteUrl / mattermostRouteHost).
  # Leave empty to use discovered values; set only to override manually.
  siteUrl: ""
  internalUrl: http://mattermost.monitoring.svc.cluster.local:8065
  route:
    host: ""
    tls: true
  # Prepackaged plugins need file storage; disable on PoC until data volume permissions are verified.
  automaticPrepackagedPlugins: true
  # RHACS generic notifier posts {"alert":...}; Mattermost Slack-compatible hooks need {"text":...}.
  # Bridge converts RHACS payloads before forwarding to the incoming webhook.
  webhookBridge:
    enabled: true
    image:
      repository: docker.io/library/python
      tag: "3.12-alpine"
    servicePort: 8080
    investigatorFanout:
      enabled: true
  bootstrap:
    enabled: true
    jobImage: docker.io/nicolaka/netshoot:v0.13
    teamName: acs
    teamDisplayName: ACS
    adminEmail: mattermost-admin@cluster.local
    adminUsername: mattermost-admin
    adminPassword: redhatpassword123
    hitlEmail: human-in-the-loop@cluster.local
    hitlPassword: redhatpassword123
  # Mattermost 10+ requires PostgreSQL (SQLite removed). Files still use mattermost-data PVC.
  postgres:
    enabled: true
    serviceName: mattermost-postgres
    image:
      repository: docker.io/library/postgres
      tag: "16-alpine"
    database: mattermost
    username: mmuser
    password: mattermost-db-password
    pvc:
      size: 5Gi
      storageClassName: gp3-csi

quayStorage:
  enabled: true
  quayOperator:
    enabled: true
    subscription:
      namespace: openshift-operators
      name: quay-operator
      channel: stable-3.15  # fallback; discovery picks latest stable-3.* from catalog
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace
  quayRegistry:
    enabled: true
    name: quay
    namespace: quay
    clusterMonitoringLabel: "true"
    # Reference Secret for Quay UI superuser credentials (not wired into Quay operator).
    # Use username/password when completing the Quay setup wizard or creating the admin user in the UI.
    adminAccount:
      enabled: true
      secretName: admin-account
      username: quayadmin
      password: CHANGE_ME_QUAY_ADMIN_PASSWORD
      email: quay-admin@cluster.local
    # Quay config bundle for unmanaged object storage (MinIO on gp3-csi).
    configBundleSecret:
      name: quay-config-bundle
    minio:
      enabled: true
      name: quay-minio
      image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
      mcImage: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
      bucketName: quay
      volumeSize: 500Gi
      storageClassName: gp3-csi
      credentialsSecret:
        name: quay-minio-credentials
        accessKey: quay-minio-access
        secretKey: CHANGE_ME_MINIO_SECRET
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
      bucketJob:
        backoffLimit: 6
        waitImage: docker.io/library/busybox:1.36
    components:
      postgres:
        storageClassName: gp3-csi
        volumeSize: 50Gi
      clairpostgres:
        storageClassName: gp3-csi
        volumeSize: 50Gi
      objectstorage:
        # managed: false — EBS-only clusters lack objectbucket.io (ODF/NooBaa). Use MinIO below.
        managed: false
      horizontalpodautoscaler:
        managed: false
      mirror:
        managed: false
  registryCredentials:
    enabled: true
    namespace: ai-workbenches
    pullSecret:
      name: quay-registry-credentials
    envSecret:
      name: quay-registry-env
    # server is derived from cluster.appsDomain when empty (quay-quay.apps.<domain>).
    server: ""
    username: ai-workbench-pull
    password: CHANGE_ME_PASSWORD
    useExistingDockerconfig: false
    existingDockerconfig: ""

# Node Feature Discovery + NVIDIA GPU Operator (time-slicing). Requires Certified Operators + Red Hat Operators catalogs.
accelerators:
  enabled: true
  nfd:
    enabled: true
    namespace: openshift-nfd
    clusterMonitoringLabel: "true"
    operatorGroup:
      name: openshift-nfd
    subscription:
      name: nfd
      channel: stable
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace
  gpuOperator:
    enabled: true
    namespace: nvidia-gpu-operator
    clusterMonitoringLabel: "true"
    operatorGroup:
      name: nvidia-gpu-operator
    subscription:
      name: gpu-operator-certified
      channel: stable
      installPlanApproval: Automatic
      source: certified-operators
      sourceNamespace: openshift-marketplace
  timeSlicing:
    # ConfigMap consumed by ClusterPolicy devicePlugin.config
    configMapName: time-slicing-config
    configKey: any
    # Slice only GPU 0 on the single g6.12xlarge (4× L4). GPUs 1–3 stay nvidia.com/gpu.
    # Do not use 3× g6.4xlarge: devices ["0"] would time-slice every node's only GPU.
    replicasPerGpu: 4
    devices:
      - "0"
    renameResource: nvidia.com/gpu.shared
    migStrategy: none
  # AWS GPU MachineSet taints nodes nvidia.com/gpu=NoSchedule. Extra toleration is a no-op if untainted.
  gpuTaintToleration:
    enabled: true
  clusterPolicy:
    name: gpu-cluster-policy
    operator:
      defaultRuntime: crio
      use_ocp_driver_toolkit: true
    driver:
      enabled: true
    toolkit:
      enabled: true
    devicePlugin:
      enabled: true
    dcgm:
      enabled: true
    gfd:
      enabled: true
    dcgmExporter:
      enabled: true
    nodeStatusExporter:
      enabled: true
    migManager:
      enabled: false
    daemonsets:
      updateStrategy: RollingUpdate
      rollingUpdate:
        maxUnavailable: "1"
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists

# Red Hat OpenShift AI (RHOAI) 3.5 — operator, DataScienceCluster v2, OGX, MaaS, HardwareProfiles.
# Requires OpenShift 4.20 (or 4.19.9+) and a cluster that is not stuck on RHOAI 2.25.
# Discovery picks stable-3.5 / fast-3.5 / eus-3.5 from catalog (RHOAI_TARGET_VERSION, default 3.5).
rhoai:
  enabled: true
  targetVersion: "3.5"
  operator:
    namespace: redhat-ods-operator
    clusterMonitoringLabel: "true"
    operatorGroup:
      name: redhat-ods-operator
    subscription:
      name: rhods-operator
      channel: stable-3.5
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace
  datascienceCluster:
    name: default-dsc
    apiVersion: datasciencecluster.opendatahub.io/v2
    components:
      dashboard:
        managementState: Managed
      kserve:
        managementState: Managed
        modelsAsService:
          managementState: Managed
      ogx:
        managementState: Managed
      kueue:
        # Keep Removed on the PoC unless the 3.5 webhook accepts Managed.
        managementState: Removed
        defaultClusterQueueName: default
        defaultLocalQueueName: default
      workbenches:
        managementState: Managed
        workbenchNamespace: rhods-notebooks
      ray:
        managementState: Removed
      feastoperator:
        managementState: Removed
      modelregistry:
        managementState: Managed
        registriesNamespace: rhoai-model-registries
      trainingoperator:
        managementState: Removed
      trustyai:
        managementState: Removed
      llamastackoperator:
        managementState: Removed
      aipipelines:
        managementState: Removed
        argoWorkflowsControllers:
          managementState: Removed
  dashboardConfig:
    enabled: true
    name: odh-dashboard-config
    namespace: redhat-ods-applications
    modelAsService: true
    genAiStudio: true
  hardwareProfile:
    enabled: true
    apiVersion: infrastructure.opendatahub.io/v1alpha1
    namespace: redhat-ods-applications
    kueueLocalQueueName: default
    profiles:
      - name: l4-shared-timeslice
        displayName: "L4 time-slice (shared MiniCPM agents)"
        gpu:
          displayName: "NVIDIA L4 shared (time-sliced)"
          identifier: nvidia.com/gpu.shared
          resourceType: Accelerator
          minCount: "1"
          maxCount: "4"
          defaultCount: "1"
      - name: l4-full
        displayName: "L4 full GPU (Gemma / Granite MaaS)"
        gpu:
          displayName: "NVIDIA L4"
          identifier: nvidia.com/gpu
          resourceType: Accelerator
          minCount: "1"
          maxCount: "2"
          defaultCount: "1"
    identifiers:
      cpu:
        displayName: CPU
        identifier: cpu
        resourceType: CPU
        minCount: 1
        maxCount: "32"
        defaultCount: "4"
      memory:
        displayName: Memory
        identifier: memory
        resourceType: Memory
        minCount: 4Gi
        maxCount: 64Gi
        defaultCount: 8Gi
  # Optional Notebook workbenches (not used by the agent demo loop).
  teamWorkbenches:
    enabled: false
    image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/runtime-minimal:minimal
    imageSelection: runtime-minimal:minimal
    imageDisplayName: "Minimal Python"
    size: Small
    pvc:
      storageClassName: ""
      size: 5Gi
    resources:
      requests:
        cpu: "1"
        memory: 8Gi
      limits:
        cpu: "2"
        memory: 8Gi
    teams:
      - namespace: ai-workbenches
        name: overwatch-workbench
        displayName: "ACS Overwatch Workbench"

# Demo component toggles (PoC overlay turns the agent loop on).
components:
  bootstrapOperators:
    enabled: false
  gpuConfig:
    enabled: false
  acsPolicies:
    enabled: true
  agentsHelpfulHank:
    enabled: true
  agentsRoseyRogue:
    enabled: false
  agentsRoseyRegrets:
    enabled: false
  agentsSneakySam:
    enabled: false
  investigator:
    enabled: false
  maas:
    enabled: false
  agentBuilder:
    enabled: false
  remediatedRosey:
    enabled: false
  remediatedSam:
    enabled: false
  pipelines:
    enabled: false
  userWorkloadMonitoring:
    enabled: true

# Require demo agents in test-range to carry acs-ai-overwatch.io/telemetry=enabled.
# Non-compliant deploys: RHACS DEPLOY policy notifies Mattermost; NetworkPolicy isolates if a pod still runs.
agentTelemetryPolicy:
  enabled: true
  requiredLabel:
    key: acs-ai-overwatch.io/telemetry
    compliantValue: enabled
    nonCompliantValue: disabled
  networkPolicy:
    enabled: true
    name: agent-telemetry-block-noncompliant
  rhacs:
    enabled: true
    configMapName: acs-policy-agent-telemetry
    name: test-range-agent-telemetry-required
    severity: HIGH_SEVERITY
    # DEPLOY only — alert (and optionally block) when a non-compliant agent Deployment is applied.
    # Does not use SCALE_TO_ZERO (no runtime scale-down notifications).
    lifecycleStages:
      - DEPLOY
    # Block non-compliant agent Deployments at admission when SecuredCluster admissionControl is on.
    # RHACS still fires the policy notifier on the violation (Mattermost → Town Square).
    enforcementActions:
      - FAIL_DEPLOYMENT_CREATE_ENFORCEMENT
      - FAIL_DEPLOYMENT_UPDATE_ENFORCEMENT

# Dedicated DEPLOY policy for Sneaky Sam demo agents (no telemetry=enabled label).
# General test-range-agent-telemetry-required excludes these deployment names to avoid duplicate alerts.
sneakySamTelemetryPolicy:
  enabled: true
  deploymentNames:
    - sneaky-sam
  rhacs:
    enabled: true
    name: test-range-sneaky-sam-telemetry-violation
    severity: HIGH_SEVERITY
    lifecycleStages:
      - DEPLOY
    # Alert-only — Sneaky Sam is allowed to deploy for the demo; Mattermost carries the violation.
    enforcementActions: []

# Agent OTEL instrumentation (on by default). Deployments inject OTEL_* env so traces
# go to the shared collector. Endpoint comes from ConfigMap acs-ai-overwatch-observability-config
# when the observability bootstrap Job has written it; otherwise otlp.endpoint is used.
# Sneaky Sam still omits acs-ai-overwatch.io/telemetry=enabled (RHACS DEPLOY demo).
observability:
  agentInstrumentation:
    enabled: true
  namespace: acs-ai-overwatch-observability
  otlp:
    endpoint: acs-otel-collector.acs-ai-overwatch-observability.svc.cluster.local:4317
    grpcPort: 4317
    httpPort: 4318
  integrationConfigMap:
    namespace: acs-ai-overwatch-system
    name: acs-ai-overwatch-observability-config

# PVC for rosey-regrets agent output (enable with components.agentsRoseyRegrets).
agentsRoseyRegrets:
  namespace: test-range
  pvc:
    name: agent-reference-information
    storageClassName: gp3-csi
    size: 20Gi

# Tekton/OpenShift Pipelines defaults (see pipelines/tekton/agents-build-pipeline.yaml).
pipelines:
  namespace: acs-agent-builder
  gitUrl: ""
  gitRevision: main
  imageRegistry:
    host: quay-quay-app.quay.svc.cluster.local:80
    organization: acs-agents
  operator:
    namespace: openshift-operators
    subscription:
      name: openshift-pipelines-operator
      channel: latest
      installPlanApproval: Automatic
      source: redhat-operators
      sourceNamespace: openshift-marketplace

# Rogue + remediated agents (OpenShift Deployments; llama.cpp sidecar for in-sandbox GGUF).
agents:
  namespace: test-range
  serviceAccountName: acs-agent
  roseyServiceAccountName: acs-agent-rosey
  agentServicePort: 8000
  gitRepoUrl: ""
  llamaCpp:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    imagePullPolicy: IfNotPresent
    port: 8080
    servedModelName: minicpm-abliterated
    ngl: "99"
    contextSize: "4096"
  huggingface:
    modelRepo: tinyopsec/Huihui-MiniCPM5-2B-abliterated-GGUF
    modelFile: ""
    cacheMountPath: /models
  gpuResource: nvidia.com/gpu.shared
  gpuCount: "1"
  images:
    helpfulHank: quay-quay-app.quay.svc.cluster.local:80/acs-agents/helpful-hank:latest
    roseyRegrets: quay-quay-app.quay.svc.cluster.local:80/acs-agents/rosey-regrets:latest
    sneakySam: quay-quay-app.quay.svc.cluster.local:80/acs-agents/sneaky-sam:latest
    investigator: quay-quay-app.quay.svc.cluster.local:80/acs-agents/acs-investigator:latest
    builder: quay-quay-app.quay.svc.cluster.local:80/acs-agents/acs-agent-builder:latest
    remediatedRosey: quay-quay-app.quay.svc.cluster.local:80/acs-agents/remediated-rosey:latest
    remediatedSam: quay-quay-app.quay.svc.cluster.local:80/acs-agents/remediated-sam:latest
  rosey:
    networkAuditCommand: "Network Audit"
    outputMountPath: /agent-reference-information
    networkAuditCidr: "10.0.0.0/24"
    networkAuditTimeoutSec: "45"
    autoNetworkAudit: false
    llmDrivenNetworkAudit: true

# ACS investigator: Gemma 2 9B FP8 on a dedicated L4 (namespace acs-investigator).
# Weights come from the OpenShift AI Model Catalog (ModelCar on registry.redhat.io), not Hugging Face.
investigator:
  namespace: acs-investigator
  name: acs-investigator
  servicePort: 8080
  ogx:
    enabled: true
    name: acs-investigator-ogx
    postgres:
      enabled: true
      image: docker.io/library/postgres:16-alpine
      database: ogx
      username: ogx
      password: ogx-poc-password
      storage: 10Gi
  llm:
    name: gemma-2-9b-it-fp8
    # OpenShift AI Model Catalog ModelCar (not Hugging Face). Cluster pull secret pulls registry.redhat.io.
    modelUri: oci://registry.redhat.io/rhelai1/modelcar-gemma-2-9b-it-fp8:1.5
    servedModelName: gemma-2-9b-it-fp8
    # llminferenceservice (OpenShift AI 3.5 LLMInferenceService) or vllm (standalone Deployment fallback).
    backend: llminferenceservice
    apiBase: ""
    gpuResource: nvidia.com/gpu
    gpuCount: "1"
    maxModelLen: 4096
    gpuMemoryUtilization: 0.90
    vllmImage: registry.redhat.io/rhaii/vllm-cuda-rhel9:latest
    vllmModelPath: /mnt/models
    servicePort: 8080

# Models-as-a-Service: Granite 8B FP8 on the remaining dedicated L4 (namespace acs-maas).
# Weights come from the OpenShift AI Model Catalog (ModelCar on registry.redhat.io), not Hugging Face.
maas:
  namespace: acs-maas
  name: granite-maas
  gatewayService: maas-api
  gatewayPort: 8080
  apiKeySecret: maas-poc-api-key
  apiKey: CHANGE_ME_MAAS_API_KEY
  postgres:
    enabled: true
    image: docker.io/library/postgres:16-alpine
    database: maas
    username: maas
    password: maas-poc-password
    storage: 10Gi
  llm:
    name: granite-3-1-8b-instruct-fp8
    # OpenShift AI Model Catalog ModelCar (not Hugging Face). Cluster pull secret pulls registry.redhat.io.
    modelUri: oci://registry.redhat.io/rhelai1/modelcar-granite-3-1-8b-instruct-fp8-dynamic:1.5
    servedModelName: granite-3.1-8b-instruct-fp8
    backend: llminferenceservice
    apiBase: ""
    gpuResource: nvidia.com/gpu
    gpuCount: "1"
    maxModelLen: 4096
    gpuMemoryUtilization: 0.90
    vllmImage: registry.redhat.io/rhaii/vllm-cuda-rhel9:latest
    vllmModelPath: /mnt/models
    servicePort: 8080

# In-cluster agentic builder (OpenShift Pipelines + Buildah).
builder:
  namespace: acs-agent-builder
  name: acs-agent-builder
  servicePort: 8080
  gpuResource: nvidia.com/gpu.shared
  gpuCount: "1"

# ACS (RHACS) policy/operator settings for test-range.
acs:
  testRange:
    namespace: test-range
  operator:
    namespace: rhacs-operator
    operatorGroupName: rhacs-operator
    subscription:
      name: rhacs-operator
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      installPlanApproval: Automatic
  # OPT-IN: Full RHACS Central + SecuredCluster + bootstrap Job (init bundle, policy import,
  # Mattermost notifier). Default false so the baseline PoC (operator + policy ConfigMap only)
  # keeps working even if Central/SCS install fails. See README "Phase 3 — Full RHACS".
  central:
    enabled: false
    namespace: stackrox
    name: stackrox-central-services
    declarativeNotifier:
      configMapName: rhacs-mattermost-notifier
      configMapKey: mattermost-notifier.yaml
    route:
      enabled: true
    persistence:
      claimName: stackrox-db
      storageClassName: gp3-csi
    egress:
      connectivityPolicy: Online
    scanner:
      autoScaling: Enabled
      maxReplicas: 5
      minReplicas: 2
      replicas: 3
      component: Enabled
  securedCluster:
    name: stackrox-secured-cluster-services
    clusterName: local-cluster
    centralEndpoint: central.stackrox.svc:443
  bootstrap:
    enabled: false
    # Policies are SecurityPolicy CRs (GitOps). Bootstrap only configures SecuredCluster + Mattermost notifier.
    importPolicy: false
    mattermostIntegrationConfigMap: mattermost-acs-integration
    job:
      image: registry.redhat.io/openshift4/ose-cli:latest
      # rhacs-main-rhel8 includes /stackrox/roxctl; standalone roxctl-rhel8 often lacks pull entitlement on sandbox clusters.
      roxctlImage: registry.redhat.io/advanced-cluster-security/rhacs-main-rhel8:4.10.3
      roxctlPath: /stackrox/roxctl
      backoffLimit: 6
  policy:
    configMapName: acs-policy-test-range-runtime-guardrails
    name: test-range-runtime-guardrails
    notifierName: Mattermost Notifier
    severity: HIGH_SEVERITY
    # Alert only — post suspicious runtime activity to Mattermost; do not kill/scale pods (Rosey nmap demo).
    enforcementActions: []
    standardPorts:
      - "80"
      - "443"
      - "6443"
      - "8080"
    processWhitelist:
      - bash
      - sh
      - python
      - python3
      - uv
      - node
      - openssl
      - curl
      - wget
      - git
      - ip
      - ping
      - traceroute
    disallowedProcesses:
      - nmap
      - masscan
      - rustscan
      - naabu
      - ncat
      - nc
      - zmap
