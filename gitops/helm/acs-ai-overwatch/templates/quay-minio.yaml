{{- if and .Values.quayStorage.enabled .Values.quayStorage.quayRegistry.enabled .Values.quayStorage.quayRegistry.minio.enabled }}
{{- $ns := .Values.quayStorage.quayRegistry.namespace }}
{{- $name := .Values.quayStorage.quayRegistry.minio.name }}
{{- $sc := .Values.quayStorage.quayRegistry.minio.storageClassName | default (include "acs-ai-overwatch.storageClassName" .) }}
{{- $credSecret := .Values.quayStorage.quayRegistry.minio.credentialsSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credSecret }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "storage") | nindent 2 }}
  namespace: {{ $ns }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: quay-minio
type: Opaque
stringData:
  accessKey: {{ .Values.quayStorage.quayRegistry.minio.credentialsSecret.accessKey | quote }}
  secretKey: {{ .Values.quayStorage.quayRegistry.minio.credentialsSecret.secretKey | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "storage" "skipHealth" true) | nindent 2 }}
  namespace: {{ $ns }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: quay-minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.quayStorage.quayRegistry.minio.volumeSize }}
  storageClassName: {{ $sc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "storage") | nindent 2 }}
  namespace: {{ $ns }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: quay-minio-server
spec:
  selector:
    app.kubernetes.io/component: quay-minio-server
    app.kubernetes.io/name: {{ include "acs-ai-overwatch.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "storage") | nindent 2 }}
  namespace: {{ $ns }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: quay-minio-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: quay-minio-server
      app.kubernetes.io/name: {{ include "acs-ai-overwatch.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "acs-ai-overwatch.labels" . | nindent 8 }}
        app.kubernetes.io/component: quay-minio-server
    spec:
      containers:
        - name: s3
          image: {{ .Values.quayStorage.quayRegistry.minio.image | quote }}
          args:
            - mini
            - -s3.port=9000
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -ip={{ $name }}.{{ $ns }}.svc.cluster.local
            - -bucket={{ .Values.quayStorage.quayRegistry.minio.bucketName }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $credSecret }}
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credSecret }}
                  key: secretKey
          ports:
            - containerPort: 9000
              name: api
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.quayStorage.quayRegistry.minio.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
{{- end }}
