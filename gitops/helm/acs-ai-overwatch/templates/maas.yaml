{{- if and .Values.components.maas.enabled (include "acs-ai-overwatch.clusterConfigReady" .) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.maas.namespace }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "namespace") | nindent 2 }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    argocd.argoproj.io/managed-by: openshift-gitops
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.maas.apiKeySecret }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "secrets") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
stringData:
  api-key: {{ .Values.maas.apiKey | quote }}
---
{{- if .Values.maas.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: maas-postgres
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "secrets") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
stringData:
  password: {{ .Values.maas.postgres.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgres
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "pvcs") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ include "acs-ai-overwatch.storageClassName" . }}
  resources:
    requests:
      storage: {{ .Values.maas.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "workloads") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/name: maas-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.maas.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.maas.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.maas.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "workloads") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
spec:
  selector:
    app.kubernetes.io/name: maas-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
---
{{- if include "acs-ai-overwatch.useLlmInferenceService" (dict "root" . "backend" .Values.maas.llm.backend) }}
{{- include "acs-ai-overwatch.llmInferenceService" (dict "root" . "llm" .Values.maas.llm "namespace" .Values.maas.namespace "component" "maas-llm") }}
{{- else }}
{{- include "acs-ai-overwatch.standaloneVllmDeployment" (dict "root" . "llm" .Values.maas.llm "namespace" .Values.maas.namespace "component" "maas-llm" "extraArgs" (list "--trust-remote-code")) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "configMaps") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
data:
  gateway.py: |
    #!/usr/bin/env python3
    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    UPSTREAM = os.environ.get("UPSTREAM", "http://127.0.0.1:8080")
    API_KEY = os.environ.get("MAAS_API_KEY", "")
    PORT = int(os.environ.get("PORT", "8080"))

    class Handler(BaseHTTPRequestHandler):
        def _proxy(self):
            auth = self.headers.get("Authorization", "")
            token = auth.split(" ", 1)[-1].strip() if auth else ""
            if API_KEY and token != API_KEY:
                self.send_response(401)
                self.end_headers()
                self.wfile.write(b"unauthorized")
                return
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length) if length else b""
            req = urllib.request.Request(
                UPSTREAM.rstrip("/") + self.path,
                data=body if self.command in ("POST", "PUT", "PATCH") else None,
                method=self.command,
                headers={"Content-Type": self.headers.get("Content-Type", "application/json")},
            )
            try:
                with urllib.request.urlopen(req, timeout=180) as resp:
                    data = resp.read()
                    self.send_response(resp.status)
                    self.send_header("Content-Type", resp.headers.get("Content-Type", "application/json"))
                    self.end_headers()
                    self.wfile.write(data)
            except Exception as exc:
                self.send_response(502)
                self.end_headers()
                self.wfile.write(str(exc).encode())

        def do_GET(self):
            if self.path in ("/healthz", "/"):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self._proxy()

        def do_POST(self):
            self._proxy()

        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.maas.gatewayService }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "workloads") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.maas.gatewayService }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.maas.gatewayService }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.maas.gatewayService }}
        app.kubernetes.io/component: maas-gateway
    spec:
      containers:
        - name: gateway
          image: docker.io/library/python:3.12-alpine
          command: ["python", "/app/gateway.py"]
          env:
            - name: UPSTREAM
              value: {{ include "acs-ai-overwatch.maasUpstreamApiBase" . | quote }}
            - name: MAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.maas.apiKeySecret }}
                  key: api-key
            - name: PORT
              value: {{ .Values.maas.gatewayPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.maas.gatewayPort }}
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: script
          configMap:
            name: maas-gateway
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.maas.gatewayService }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "workloads") | nindent 2 }}
  namespace: {{ .Values.maas.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.maas.gatewayService }}
  ports:
    - name: http
      port: {{ .Values.maas.gatewayPort }}
      targetPort: http
{{- end }}
