{{- if and .Values.rhoai.enabled .Values.rhoai.hardwareProfile.enabled (include "acs-ai-overwatch.crdReady" (dict "root" . "crdName" .Values.platformResources.crds.hardwareProfile)) }}
{{- $hp := .Values.rhoai.hardwareProfile }}
{{- range $hp.profiles }}
---
apiVersion: {{ $hp.apiVersion }}
kind: HardwareProfile
metadata:
  name: {{ .name }}
  {{- include "acs-ai-overwatch.argocdPlatformCrAnnotations" (dict "root" $ "wave" "platformCRs") | nindent 2 }}
  namespace: {{ $hp.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" $ | nindent 4 }}
  annotations:
    opendatahub.io/display-name: {{ .displayName | quote }}
spec:
  identifiers:
    - displayName: {{ $hp.identifiers.cpu.displayName | quote }}
      identifier: {{ $hp.identifiers.cpu.identifier | quote }}
      resourceType: {{ $hp.identifiers.cpu.resourceType }}
      minCount: {{ $hp.identifiers.cpu.minCount }}
      maxCount: {{ $hp.identifiers.cpu.maxCount | quote }}
      defaultCount: {{ $hp.identifiers.cpu.defaultCount | quote }}
    - displayName: {{ $hp.identifiers.memory.displayName | quote }}
      identifier: {{ $hp.identifiers.memory.identifier | quote }}
      resourceType: {{ $hp.identifiers.memory.resourceType }}
      minCount: {{ $hp.identifiers.memory.minCount | quote }}
      maxCount: {{ $hp.identifiers.memory.maxCount | quote }}
      defaultCount: {{ $hp.identifiers.memory.defaultCount | quote }}
    - displayName: {{ .gpu.displayName | quote }}
      identifier: {{ .gpu.identifier | quote }}
      resourceType: {{ .gpu.resourceType }}
      minCount: {{ .gpu.minCount | quote }}
      maxCount: {{ .gpu.maxCount | quote }}
      defaultCount: {{ .gpu.defaultCount | quote }}
{{- $kueueOn := ne (default "Removed" $.Values.rhoai.datascienceCluster.components.kueue.managementState) "Removed" }}
{{- $gpuTaint := $.Values.accelerators.gpuTaintToleration.enabled }}
{{- if or $kueueOn $gpuTaint }}
  scheduling:
    {{- if $kueueOn }}
    type: Queue
    kueue:
      localQueueName: {{ $hp.kueueLocalQueueName | quote }}
    {{- else }}
    type: Node
    {{- end }}
    {{- if $gpuTaint }}
    node:
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
