{{- if and .Values.rhoai.enabled .Values.rhoai.inferenceGateway.enabled (include "acs-ai-overwatch.crdReady" (dict "root" . "crdName" .Values.platformResources.crds.gateway)) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.rhoai.inferenceGateway.name }}
  namespace: {{ .Values.rhoai.inferenceGateway.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    istio.io/rev: {{ .Values.rhoai.inferenceGateway.istioRev | quote }}
  annotations:
    {{- if .Values.argocd.syncWaves.enabled }}
    argocd.argoproj.io/sync-wave: {{ index .Values.argocd.syncWaves.platformCRs | quote }}
    {{- end }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: {{ .Values.rhoai.inferenceGateway.gatewayClassName }}
  listeners:
    - name: {{ .Values.rhoai.inferenceGateway.listenerName }}
      port: {{ .Values.rhoai.inferenceGateway.port }}
      protocol: {{ .Values.rhoai.inferenceGateway.protocol }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ .Values.rhoai.inferenceGateway.routeLabel }}: "true"
      {{- if eq .Values.rhoai.inferenceGateway.protocol "HTTPS" }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.rhoai.inferenceGateway.tlsSecretName }}
      {{- end }}
{{- end }}
