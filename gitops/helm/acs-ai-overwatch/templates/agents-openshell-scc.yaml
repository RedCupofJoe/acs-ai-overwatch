{{- if or .Values.components.agentsCompliantChris.enabled .Values.components.remediatedRosey.enabled .Values.components.remediatedSam.enabled .Values.components.agentBuilder.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agents.openShellServiceAccountName }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "security") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    acs-ai-overwatch.io/runtime: openshell
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: openshell-runtime
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "security") | nindent 2 }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    acs-ai-overwatch.io/runtime: openshell
allowPrivilegedContainer: true
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowedCapabilities:
  - NET_ADMIN
  - NET_RAW
  - IPC_LOCK
  - SYS_ADMIN
  - SYS_PTRACE
defaultAddCapabilities: []
requiredDropCapabilities:
  - MKNOD
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
  - unconfined
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:{{ .Values.agents.namespace }}:{{ .Values.agents.openShellServiceAccountName }}
{{- end }}
