{{- if and .Values.rhoai.enabled .Values.rhoai.certManager.enabled }}
{{- if include "acs-ai-overwatch.createNamespaces" . }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.rhoai.certManager.namespace }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "namespace") | nindent 2 }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.rhoai.certManager.operatorGroup.name }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "operators") | nindent 2 }}
  namespace: {{ .Values.rhoai.certManager.namespace }}
spec:
  targetNamespaces:
    - {{ .Values.rhoai.certManager.namespace }}
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.rhoai.certManager.subscription.name }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "operators") | nindent 2 }}
  namespace: {{ .Values.rhoai.certManager.namespace }}
spec:
  channel: {{ include "acs-ai-overwatch.operatorChannel" (dict "root" . "key" "certManagerOperatorChannel" "default" .Values.rhoai.certManager.subscription.channel) }}
  installPlanApproval: {{ .Values.rhoai.certManager.subscription.installPlanApproval }}
  name: {{ .Values.rhoai.certManager.subscription.name }}
  source: {{ .Values.rhoai.certManager.subscription.source }}
  sourceNamespace: {{ .Values.rhoai.certManager.subscription.sourceNamespace }}
{{- end }}
