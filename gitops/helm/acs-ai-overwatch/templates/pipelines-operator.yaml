{{- if .Values.components.pipelines.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.pipelines.operator.subscription.name }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "operators") | nindent 2 }}
  namespace: {{ .Values.pipelines.operator.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.pipelines.operator.subscription.channel }}
  installPlanApproval: {{ .Values.pipelines.operator.subscription.installPlanApproval }}
  name: openshift-pipelines-operator-rh
  source: {{ .Values.pipelines.operator.subscription.source }}
  sourceNamespace: {{ .Values.pipelines.operator.subscription.sourceNamespace }}
{{- end }}
