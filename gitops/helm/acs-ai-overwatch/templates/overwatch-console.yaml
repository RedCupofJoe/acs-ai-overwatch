{{- if and .Values.components.overwatchConsole.enabled (include "acs-ai-overwatch.clusterConfigReady" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overwatch-console
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/name: overwatch-console
    app.kubernetes.io/component: overwatch-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: overwatch-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overwatch-console
        app.kubernetes.io/component: overwatch-console
        app.kubernetes.io/part-of: acs-ai-overwatch
    spec:
      serviceAccountName: {{ .Values.agents.serviceAccountName }}
      containers:
        - name: overwatch-console
          image: {{ include "acs-ai-overwatch.agentImage" (dict "root" . "stream" "overwatch-console" "explicit" .Values.agents.images.overwatchConsole) }}
          imagePullPolicy: Always
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.agents.agentServicePort | quote }}
            - name: TEST_RANGE_NAMESPACE
              value: {{ .Values.agents.namespace | quote }}
            - name: MATTERMOST_SITE_URL
              value: {{ include "acs-ai-overwatch.mattermostSiteUrl" . | quote }}
            - name: ACS_CENTRAL_URL
              value: {{ include "acs-ai-overwatch.acsCentralUrl" . | quote }}
            - name: OVERWATCH_UI_DIR
              value: /opt/overwatch-console/ui
          ports:
            - name: http
              containerPort: {{ .Values.agents.agentServicePort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: overwatch-console
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
    app.kubernetes.io/name: overwatch-console
spec:
  selector:
    app.kubernetes.io/name: overwatch-console
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.agents.agentServicePort }}
---
{{- include "acs-ai-overwatch.agentRoute" (dict "root" . "name" "overwatch-console") }}
{{- end }}
