{{- if or .Values.components.maas.enabled .Values.components.remediatedRosey.enabled .Values.components.remediatedSam.enabled .Values.components.agentBuilder.enabled .Values.components.agentsCompliantChris.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.maas.apiKeySecret }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "secrets") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
stringData:
  api-key: {{ .Values.maas.apiKey | quote }}
{{- end }}
{{/* Remediated Rosey and Sam are Sandbox CRs created by the builder after the TPA gate. */}}
