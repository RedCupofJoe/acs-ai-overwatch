{{- if or .Values.components.agentsHelpfulHank.enabled .Values.components.agentsRoseyRegrets.enabled .Values.components.agentsSneakySam.enabled .Values.components.remediatedRosey.enabled .Values.components.remediatedSam.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agents.serviceAccountName }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "security") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agents.roseyServiceAccountName }}
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "security") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: acs-agent-restricted
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "security") | nindent 2 }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
allowPrivilegedContainer: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
readOnlyRootFilesystem: false
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:{{ .Values.agents.namespace }}:{{ .Values.agents.serviceAccountName }}
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: acs-agent-rosey-recon
  {{- include "acs-ai-overwatch.argocdSyncWaveAnnotations" (dict "root" . "wave" "security") | nindent 2 }}
  labels:
    {{- include "acs-ai-overwatch.labels" . | nindent 4 }}
allowPrivilegedContainer: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowedCapabilities:
  - NET_ADMIN
  - NET_RAW
defaultAddCapabilities: []
requiredDropCapabilities:
  - MKNOD
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:{{ .Values.agents.namespace }}:{{ .Values.agents.roseyServiceAccountName }}
{{- end }}
