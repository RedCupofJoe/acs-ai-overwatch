# PoC cluster overlay — merged after values.yaml (see gitops/argocd/application.yaml).
#
# All PVCs use gp3-csi from values.yaml. Override storage.defaultStorageClass here
# if `oc get storageclass` shows a different name.

platformResources:
  waitForCrds: false

# Disable Quay until you are ready to build/push agent images (uses gp3-csi when enabled).
quayStorage:
  enabled: true

mattermost:
  automaticPrepackagedPlugins: false

components:
  # Hank, Rosey, and Sam live in the optional misbehavior Application.
  # Compliant Chris lives in the approved Application (Agent Sandbox).
  agentsHelpfulHank:
    enabled: false
  agentsRoseyRegrets:
    enabled: false
  agentsSneakySam:
    enabled: false
  agentsCompliantChris:
    enabled: false
  demoSecurityPolicies:
    enabled: false
  overwatchConsole:
    enabled: true
  investigator:
    enabled: true
  maas:
    enabled: true
  agentBuilder:
    enabled: true
  pipelines:
    enabled: true

acs:
  central:
    enabled: true
  bootstrap:
    enabled: true

rhoai:
  datascienceCluster:
    components:
      kueue:
        managementState: Removed
  hardwareProfile:
    enabled: true
