apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-zero-trust-workload-identity-manager
  {{- include "trust.wave" (dict "root" . "wave" "operators") | nindent 2 }}
  namespace: {{ .Values.ztwim.namespace }}
  labels:
    {{- include "trust.labels" . | nindent 4 }}
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.ztwim.subscription.name }}
  {{- include "trust.wave" (dict "root" . "wave" "operators") | nindent 2 }}
  namespace: {{ .Values.ztwim.namespace }}
  labels:
    {{- include "trust.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.ztwim.subscription.channel }}
  installPlanApproval: Automatic
  name: {{ .Values.ztwim.subscription.package }}
  source: {{ .Values.ztwim.subscription.source }}
  sourceNamespace: {{ .Values.ztwim.subscription.sourceNamespace }}
---
apiVersion: operators.coreos.com/v1
