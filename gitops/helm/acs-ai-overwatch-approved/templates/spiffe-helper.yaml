{{- if include "approved.crdReady" (dict "root" . "crdName" .Values.platformResources.sandboxCrd) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.spiffe.configMap }}
  {{- include "approved.wave" (dict "root" . "wave" "agents") | nindent 2 }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "approved.labels" . | nindent 4 }}
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = {{ .Values.spiffe.certDir | quote }}
    jwt_svids = [{
      jwt_audience = {{ .Values.spiffe.audience | quote }}
      jwt_svid_file_name = {{ .Values.spiffe.jwtFile | quote }}
    }]
{{- end }}
